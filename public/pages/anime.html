<!DOCTYPE html>
<html lang="en" data-auth="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime - WGWAnime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Lucide icons library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts loaded here -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <!-- Sticky top navigation bar -->
  <header class="navbar">
    <a href="../index.html" class="navbar__logo">WGW<span>Anime</span></a>

    <!-- Hamburger button appears on mobile only -->
    <button class="navbar__hamburger" id="hamburger" aria-label="Open menu">
      <i data-lucide="menu"></i>
    </button>

    <!-- Desktop navigation links -->
    <nav class="navbar__links">
      <a href="./genres.html">Genres</a>
      <div class="navbar__dropdown">
        <button class="navbar__dropdown-btn">Types ▾</button>
        <ul class="navbar__dropdown-menu">
          <li><a href="./browse.html?type=tv">TV</a></li>
          <li><a href="./browse.html?type=movie">Movie</a></li>
          <li><a href="./browse.html?type=ova">OVA</a></li>
          <li><a href="./browse.html?type=ona">ONA</a></li>
          <li><a href="./browse.html?type=special">Special</a></li>
        </ul>
      </div>
      <a href="./saved.html">My List</a>
    </nav>

    <!-- Search bar and auth buttons on the right -->
    <div class="navbar__right">
      <form class="navbar__search" id="searchForm">
        <input type="text" id="searchInput" placeholder="Search anime…" autocomplete="off" />
        <button type="submit" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </form>

      <!-- Shown when the user is not logged in -->
      <div class="navbar__auth" data-show-when="logged-out">
        <a href="./login.html" class="btn btn--ghost btn--sm">Log in</a>
        <a href="./register.html" class="btn btn--primary btn--sm">Sign up</a>
      </div>

      <!-- Shown when the user is logged in -->
      <div class="navbar__user" data-show-when="logged-in">
        <a id="profileLink" href="#" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
          <img id="userAvatar" class="navbar__avatar" src="/public/assets/default-pfp-24.jpg" alt="avatar" />
          <span id="userDisplayName" style="font-size:0.875rem;font-weight:600;color:var(--text);"></span>
        </a>
        <button id="logoutBtn" class="btn btn--ghost btn--sm">Logout</button>
      </div>
    </div>
  </header>

  <!-- Mobile navigation drawer slides down from the header -->
  <div class="navbar__mobile-drawer" id="mobileDrawer">
    <a href="./genres.html">Genres</a>
    <a href="./browse.html?type=tv">TV</a>
    <a href="./browse.html?type=movie">Movie</a>
    <a href="./browse.html?type=ova">OVA</a>
    <a href="./browse.html?type=ona">ONA</a>
    <a href="./browse.html?type=special">Special</a>
    <a href="./saved.html">My List</a>
    <!-- Mobile search input -->
    <div class="navbar__mobile-search">
      <form class="navbar__search" id="searchFormMobile">
        <input type="text" id="searchInputMobile" placeholder="Search anime…" autocomplete="off" />
        <button type="submit" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </form>
    </div>
    <!-- Auth links shown when logged out -->
    <div data-show-when="logged-out" style="display:flex;gap:8px;margin-top:8px;">
      <a href="./login.html" class="btn btn--ghost btn--sm">Log in</a>
      <a href="./register.html" class="btn btn--primary btn--sm">Sign up</a>
    </div>
    <!-- User avatar and logout shown when logged in -->
    <div data-show-when="logged-in" style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;">
      <a id="profileLinkMobile" href="#" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
        <img id="userAvatarMobile" class="navbar__avatar" src="/public/assets/default-pfp-24.jpg" alt="avatar" />
        <span id="userDisplayNameMobile" style="font-size:0.875rem;font-weight:600;color:var(--text);"></span>
      </a>
      <button id="logoutBtnMobile" class="btn btn--ghost btn--sm">Logout</button>
    </div>
  </div>

  <!-- Full width blurred banner image sits behind the detail layout -->
  <div class="detail-banner">
    <!-- Banner image src is set by anime.js -->
    <img id="detailBannerImg" class="detail-banner__img" src="" alt="" />
    <!-- Gradient fades the banner into the page background -->
    <div class="detail-banner__fade"></div>
  </div>

  <!-- Two column layout: poster on the left, info on the right -->
  <div class="detail-layout">

    <!-- Left column: poster image plus action controls -->
    <aside class="detail-poster">
      <!-- Poster image src is set by anime.js -->
      <img id="detailPoster" class="detail-poster__img" src="" alt="" />

      <div class="detail-poster__actions">
        <!-- Primary add button changes to show status once added -->
        <button class="btn btn--primary" id="watchlistBtn">+ Add to List</button>
        <!-- Trailer button reveals the inline trailer section -->
        <button class="btn btn--ghost"   id="trailerBtn" style="display:none">▶ Trailer</button>
      </div>

      <!-- Status picker and progress controls appear after adding to list -->
      <div class="watchlist-status-wrap" id="watchlistStatusWrap" style="display:none">

        <select class="watchlist-status-select" id="watchlistStatus">
          <option value="watching">Watching</option>
          <option value="completed">Completed</option>
          <option value="planning">Plan to Watch</option>
          <option value="paused">On Hold</option>
          <option value="dropped">Dropped</option>
        </select>

        <!-- Episode progress tracker -->
        <div class="watchlist-progress" id="watchlistProgressWrap">
          <label>Episode progress</label>
          <div class="progress-input-row">
            <input type="number" id="watchlistProgress" min="0" value="0" />
            <!-- Total episode count is set by anime.js -->
            <span id="watchlistTotal"></span>
          </div>
          <!-- Visual fill bar updates as episode count changes -->
          <div class="progress-bar">
            <div class="progress-bar__fill" id="progressFill"></div>
          </div>
        </div>

        <button class="btn btn--surface btn--sm" id="removeFromList">Remove from list</button>
      </div>
    </aside>

    <!-- Right column: all anime info and interactive sections -->
    <main class="detail-info">

      <div class="detail-info__titles">
        <!-- Japanese and English titles are set by anime.js -->
        <h1 class="detail-info__title"    id="detailTitle"></h1>
        <p  class="detail-info__title-en" id="detailTitleEn"></p>
      </div>

      <!-- Meta row with score, type, status, year -->
      <div class="detail-info__meta" id="detailMeta"></div>

      <!-- Stat grid showing score, rank, popularity, episodes etc -->
      <div class="detail-stats" id="detailStats"></div>

      <!-- Synopsis with show more toggle -->
      <div class="detail-section">
        <h3>Synopsis</h3>
        <!-- collapsed class is removed by the toggle button -->
        <p class="detail-synopsis collapsed" id="detailSynopsis"></p>
        <span class="detail-synopsis-toggle" id="synopsisToggle">Show more ▾</span>
      </div>

      <!-- Embedded YouTube trailer hidden until trailer button is clicked -->
      <div class="detail-section" id="trailerSection" style="display:none">
        <h3>Trailer</h3>
        <div class="detail-trailer">
          <iframe id="detailTrailer" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
      </div>

      <!-- Genre and theme tag chips -->
      <div class="detail-section" id="tagsSection">
        <h3>Genres</h3>
        <!-- Tag links are injected here by anime.js -->
        <div class="detail-tags" id="detailGenres"></div>
      </div>

      <!-- Studio name chips -->
      <div class="detail-section" id="studiosSection">
        <h3>Studios</h3>
        <!-- Studio links are injected here by anime.js -->
        <div class="detail-tags" id="detailStudios"></div>
      </div>

      <!-- Community reviews section -->
      <div class="detail-section" id="reviewsSection">
        <h3>Reviews</h3>

        <!-- Write a review form only visible when logged in -->
        <div class="review-form" id="reviewForm" data-show-when="logged-in">
          <!-- Star rating picker from 1 to 10 -->
          <div class="star-picker" id="starPicker">
            <span data-val="1">★</span><span data-val="2">★</span>
            <span data-val="3">★</span><span data-val="4">★</span>
            <span data-val="5">★</span><span data-val="6">★</span>
            <span data-val="7">★</span><span data-val="8">★</span>
            <span data-val="9">★</span><span data-val="10">★</span>
          </div>
          <textarea id="reviewText" placeholder="Write your review…"></textarea>
          <button class="btn btn--primary btn--sm" id="submitReview" style="margin-top:12px">Post Review</button>
        </div>

        <!-- Existing review cards are injected here by anime.js -->
        <div id="reviewsList"></div>
      </div>

      <!-- Recommendation cards based on this anime -->
      <div class="detail-section" id="recsSection">
        <h3>You Might Also Like</h3>
        <!-- Slider wrap gives the recs row the same arrow and scroll behaviour as home page rows -->
        <div class="row__slider-wrap" style="margin-top:12px;">
          <button class="row__arrow row__arrow--prev" id="recsPrev"><i data-lucide="chevron-left"></i></button>
          <div class="row__cards" id="recsList"></div>
          <button class="row__arrow row__arrow--next" id="recsNext"><i data-lucide="chevron-right"></i></button>
        </div>
      </div>

    </main>
  </div>

  <!-- Full screen trailer modal overlay -->
  <div class="hero__trailer-wrap" id="trailerModal">
    <button class="hero__trailer-close" id="trailerModalClose">✕</button>
    <iframe id="trailerModalFrame" src="" allowfullscreen allow="autoplay"></iframe>
  </div>

  <footer class="footer">
    <span class="footer__logo">WGW<span>Anime</span></span>
    <p>Powered by <a href="https://jikan.moe/" target="_blank">Jikan API</a></p>
  </footer>

  <script>lucide.createIcons();</script>
  <script type="module" src="../scripts/dropdown.js"></script>
  <script type="module" src="../scripts/auth.js"></script>
  <script type="module" src="../scripts/anime.js"></script>
  <script type="module" src="../scripts/search.js"></script>


</body>
</html>
