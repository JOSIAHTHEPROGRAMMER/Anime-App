<!DOCTYPE html>
<html lang="en" data-auth="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - WGWAnime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Lucide icons library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts loaded here -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <!-- Full page centered login form -->
  <div class="auth-page">
    <div class="auth-card">

      <!-- Site logo at top of card -->
      <div class="auth-card__logo">WGW<span>Anime</span></div>
      <h2 class="auth-card__title">Welcome back</h2>
      <p class="auth-card__sub">Log in to your account</p>

      <!-- Email field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <p class="form-error" id="emailError"></p>
      </div>

      <!-- Password field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <p class="form-error" id="passwordError"></p>
      </div>

      <!-- Global error shown when login fails -->
      <p class="form-error" id="globalError"></p>

      <button class="btn btn--primary" id="loginBtn">Log in</button>

      <!-- Link to registration page -->
      <div class="auth-switch">
        Don't have an account? <a href="./register.html">Sign up</a>
      </div>

    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="../scripts/dropdown.js"></script>
  <script type="module" src="../scripts/login.js"></script>

</body>
</html>
