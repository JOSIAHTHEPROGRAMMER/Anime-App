<div class="login-form-container" id="login-form-container"> 
    <label for="show" class="close-btn fas fa-xmark" title="close"></label>
    <div class="text" id="form-title">Login Form</div>
    <form id="auth-form" action="#">
        <div id="login-form"> 
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
        </div>
        <div id="signup-form" style="display: none;"> 
            <input type="file" id="user-photo-sign-up" class="user-photo-sign-up" accept="image/*">  <!--user upload image to be used as thier profile picture -->
            <input type="text" id="signup-username" placeholder="Username"> <!-- user their name here aswell-->
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
        </div>
        <div class="btn">
            <button type="submit">Login</button> 
        </div>
        <div class="btn google-btn">
            <button type="button" id="google-login-btn">Login with Google</button> 
        </div>
        <div class="signup-link">
            Not a member? <a href="#" id="toggle-form">Signup now</a>
        </div>
    </form>
