<!DOCTYPE html>
<html lang="en" data-auth="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WGWAnime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="index.html" class="navbar__logo">WGW<span>Anime</span></a>

    <nav class="navbar__links">
      <a href="./pages/genres.html">Genres</a>
      <div class="navbar__dropdown">
        <button class="navbar__dropdown-btn">Types ▾</button>
        <ul class="navbar__dropdown-menu" id="typesMenu">
          <li><a href="./pages/displayAnimes.html?type=tv">TV</a></li>
          <li><a href="./pages/displayAnimes.html?type=movie">Movie</a></li>
          <li><a href="./pages/displayAnimes.html?type=ova">OVA</a></li>
          <li><a href="./pages/displayAnimes.html?type=ona">ONA</a></li>
          <li><a href="./pages/displayAnimes.html?type=special">Special</a></li>
        </ul>
      </div>
      <a href="./pages/saved.html">My List</a>
    </nav>

    <div class="navbar__right">
      <form class="navbar__search" id="searchForm">
        <input type="text" id="searchInput" placeholder="Search anime…" autocomplete="off" />
        <button type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </form>

      <!-- Shown when logged OUT -->
      <div class="navbar__auth" data-show-when="logged-out">
        <a href="./pages/login.html" class="btn btn--ghost">Log in</a>
        <a href="./pages/register.html" class="btn btn--primary">Sign up</a>
      </div>

      <!-- Shown when logged IN -->
      <div class="navbar__user" data-show-when="logged-in">
        <img id="userAvatar" class="navbar__avatar" src="" alt="avatar" />
        <span id="userDisplayName"></span>
        <button id="logoutBtn" class="btn btn--ghost btn--sm">Logout</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="heroSection">

    <div class="hero__bg" id="heroBg"></div>

    <!-- Muted hover preview iframe -->
    <iframe class="hero__hover-frame" id="heroHoverFrame" src="" allowfullscreen allow="autoplay"></iframe>

    <div class="hero__overlay"></div>

    <div class="hero__content">
      <span class="hero__spotlight" id="heroSpotlight"></span>
      <h1 class="hero__title" id="heroTitle"></h1>
      <div class="hero__meta" id="heroMeta"></div>
      <p class="hero__synopsis" id="heroSynopsis"></p>
      <div class="hero__actions">
        <a id="heroDetailBtn" href="#" class="btn btn--primary btn--lg">Detail →</a>
        <button id="heroTrailerBtn" class="btn btn--ghost btn--lg" style="display:none">▶ Trailer</button>
      </div>
    </div>

    <!-- Poster on the right -->
    <div class="hero__poster-wrap">
      <img id="heroPoster" class="hero__poster" src="" alt="" />
    </div>

    <button class="hero__arrow hero__arrow--prev" id="heroPrev">&#8249;</button>
    <button class="hero__arrow hero__arrow--next" id="heroNext">&#8250;</button>
    <div class="hero__dots" id="heroDots"></div>

  </section>

  <!-- MAIN CONTENT -->
  <main class="content">

    <!-- Currently Airing -->
    <section class="row" id="seasonNow">
      <div class="row__header">
        <h2>Currently Airing</h2>
        <a href="./pages/displayAnimes.html?filter=airing" class="row__see-all">See all</a>
      </div>
      <div class="row__slider-wrap">
        <button class="row__arrow row__arrow--prev" id="seasonNowPrev">&#8249;</button>
        <div class="row__cards" id="seasonNowList"></div>
        <button class="row__arrow row__arrow--next" id="seasonNowNext">&#8250;</button>
      </div>
    </section>

    <!-- Upcoming -->
    <section class="row" id="upcoming">
      <div class="row__header">
        <h2>Upcoming This Season</h2>
        <a href="./pages/displayAnimes.html?filter=upcoming" class="row__see-all">See all</a>
      </div>
      <div class="row__slider-wrap">
        <button class="row__arrow row__arrow--prev" id="upcomingPrev">&#8249;</button>
        <div class="row__cards" id="upcomingList"></div>
        <button class="row__arrow row__arrow--next" id="upcomingNext">&#8250;</button>
      </div>
    </section>

    <!-- Same Season Last Year -->
    <section class="row" id="prevYear">
      <div class="row__header">
        <h2>This Season Last Year</h2>
        <a href="./pages/displayAnimes.html?filter=prevyear" class="row__see-all">See all</a>
      </div>
      <div class="row__slider-wrap">
        <button class="row__arrow row__arrow--prev" id="prevYearPrev">&#8249;</button>
        <div class="row__cards" id="prevYearList"></div>
        <button class="row__arrow row__arrow--next" id="prevYearNext">&#8250;</button>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span class="footer__logo">WGW<span>Anime</span></span>
    <p>Powered by <a href="https://jikan.moe/" target="_blank">Jikan API</a></p>
  </footer>


  <script type="module" src="./scripts/auth.js"></script>
  <script type="module" src="./scripts/home.js"></script>
  <script type="module" src="./scripts/dropdown.js"></script>
  <script type="module" src="./scripts/search.js"></script>

</body>
</html>
