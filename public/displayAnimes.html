<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Anime Filter</title>

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


    <!-- Login/Register css -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./styles/login-register.css">


    <!-- Custom CSS File Link -->
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/style5.css">


</head>
<body>

    <!-- Header Section Start -->
    <header>
        <a href="index.html" class="logo"><i class="fa-brands fa-artstation"></i> WGWAnime</a>
        <nav class="navbar">
         
          
          
        </nav>
        <div class="icons">
         
     
            <div class="dropdown">
                <i class="fas fa-bars dropbtn" id="menu-bars"></i>
                <div class="dropdown-content" id="dropdown-content">
                    <a class="home-link" href="index.html">home</a>
                    <a class="genres-link" href="genres.html">Genres</a>
                    
                    <div class="dropdown">
                        <a class="types-link" href="#">Types</a>
                        <div class="dropdown-content-sub">
                            <a href="displayAnimes.html?type=tv">tv</a>
                            <a href="displayAnimes.html?type=movie">movie</a>
                            <a href="displayAnimes.html?type=ova">ova</a>
                            <a href="displayAnimes.html?type=special">special</a>
                            <a href="displayAnimes.html?type=ona">ona</a>
                            <a href="displayAnimes.html?type=music">music</a>
                            <a href="displayAnimes.html?type=cm">cm</a>
                            <a href="displayAnimes.html?type=pv">pv</a>
                            <a href="displayAnimes.html?type=tv_special">tv special</a>
                        </div>
                    </div>
                    

                    <a class="random-link" href="randomAnime.html">Random Anime</a>
              
                    
                </div>
            </div>
            
            <div class="search-box">
                <button class="btn-search" id="search-button" ><i class="fas fa-search"></i></button>
                <input type="text" class="input-search" id="search-input" placeholder="Type to Search..." autocomplete="off">
            </div>
          
            <a href="saved-anime.html" class="fas fa-heart"></a>

            <button class="btn login-btn" id="login-toggle-btn">Sign up/Login <i class="fa-solid fa-right-to-bracket"></i></button>

            <div class="user-profile-container" id="user-profile-container" style="display: none;">
                <img id="user-photo" class="user-profile-pic" src=".image/default-pfp-24.jpg" alt="User Photo">
                <span id="user-name" class="user-profile-name">User Name</span>
                <div id="dropdown-menu" class="dropdown-menu">
                    <a href="#" id="logout-btn" class="btn logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>
        <!-- Login form container -->
<div class="login-form-container" id="login-form-container"> 
    <label for="show" class="close-btn fas fa-xmark" title="close"></label>
    <div class="text" id="form-title">Login Form</div>
    <form id="auth-form" action="#">
        <div id="login-form"> 
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
        </div>
        <div id="signup-form" style="display: none;"> 
            <input type="file" id="user-photo-sign-up" class="user-photo-sign-up" accept="image/*">  <!--user upload image to be used as thier profile picture -->
            <input type="text" id="signup-username" placeholder="Username"> <!-- user their name here aswell-->
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
        </div>
        <div class="btn">
            <button type="submit">Login</button> 
        </div>
        <div class="btn google-btn">
            <button type="button" id="google-login-btn">Login with Google</button> 
        </div>
        <div class="signup-link">
            Not a member? <a href="#" id="toggle-form">Signup now</a>
        </div>
    </form>
</div>
    

    <!-- Filter Section -->
    <div class="filters-container">
        <h2>Filter</h2>
        <div class="filters">
            <label for="genre-select">Genres:</label>
            <select id="genre-select">
                <!-- Genre options will be populated manually here -->
            </select>
      
            <!-- HTML element to display the array -->
         

            

            <label for="rating-select">Rating:</label>
            <select id="rating-select">
                <option value="">All</option>
                <option value="g">G - All Ages</option>
                <option value="pg">PG - Children</option>
                <option value="pg13">PG-13 - Teens 13 or older</option>
                <option value="r17">R - 17+ (violence & profanity)</option>
                <option value="r">R+ - Mild Nudity</option>
                <option value="rx">Rx - Hentai</option>
            </select>

            <label for="order-select">Order:</label>
            <select id="order-select">
                <option value="">None</option>
                <option value="mal_id">Mal ID</option>
                <option value="title">Title</option>
                <option value="start_date">Start Date</option>
                <option value="end_date">End Date</option>
                <option value="score">Score</option>
                <option value="scored_by">Scored by</option>
                <option value="rank">Rank</option>
                <option value="popularity">Popularity</option>
                <option value="members">Members</option>
                <option value="favorites">Favorites</option>
            </select>
            


            <label for="type-select">Type:</label>
            <select id="type-select">
                <option value="">All</option>
                <option value="tv">Tv</option>
                <option value="movie">Movie</option>
                <option value="special">Special</option>
                <option value="ona">ONA</option>
                <option value="ova">OVA</option>
                <option value="music">Music</option>
                <option value="cm">CM</option>
                <option value="pv">PV</option>
                <option value="tv_special">Tv Special</option>
            </select>
            
            <label for="status-select">Status:</label>
            <select id="status-select">
                <option value="">All</option>
                <option value="airing">Airing</option>
                <option value="complete">Complete</option>
                <option value="upcoming">Upcoming</option>
            </select>

            <label for="sort-select">Sort:</label>
            <select id="sort-select">
                <option value="">None</option>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
               
            </select>
            
            <!-- <label for="season-select">Season:</label>
            <select id="season-select">
          
              
                <option value="default">None</option>
                <option value="winter">Winter</option>
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
                <option value="fall">fall</option>
               
            </select>

     
         -->
            




            <button id="filter-button">Apply Filters</button>
          
        </div>
        <div id="output"></div>
        <button id="reset-button">Reset Filters</button>
    </div>
 
    <!-- Anime List Section -->
    <div class="anime-list-container" id="anime-list-container">
        <!-- Anime will be dynamically populated here -->
    </div>
    
    <div class="pagination" id="pagination">
        <!-- Pagination buttons will be dynamically populated here -->
    </div>

    <!-- Copyright -->
    <div class="copyright container">
        <a href="index.html" class="logo"><i class="fa-brands fa-artstation"></i> WGWAnime</a>
        <p>&#169; WGP. All rights reserved.</p>
    </div>

<!-- All the scripts for this programme -->
    <script type="module" src="./scripts/firebase.mjs"></script>  <!-- Firebase configuration and initialization -->
    <script type="module" src="./scripts/auth.mjs"></script>    
    <script type="module" src="./scripts/login.js"></script>
   
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./scripts/filters.js"></script>
    <script src="./scripts/search.js"></script>
    <script src="./scripts/dropDown.js"></script>  
</body>
</html>
